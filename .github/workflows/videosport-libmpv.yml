# videoSport: builds ONLY an LGPL libmpv-2.dll (x86_64 baseline, gcc) and publishes it as an artifact and as a
# GitHub Release of this fork. See README_videosport.md. Derived from mpv_gcc.yml (upstream).
name: videosport libmpv lgpl
defaults:
  run:
    shell: bash

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a GitHub Release with the libmpv package'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Building LGPL libmpv (x86_64)
    runs-on: ubuntu-latest
    env:
      BIT: x86_64
    container:
      image: docker://ghcr.io/shinchiro/archlinux:latest
    outputs:
      tag: ${{ steps.pkg.outputs.tag }}
    steps:
      - name: Setup git config
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global pull.rebase true
          git config --global rebase.autoStash true
          git config --global fetch.prune true
          git config --global --add safe.directory $PWD

      - uses: actions/checkout@v4

      - name: Loading toolchain cache
        uses: actions/cache/restore@v4
        with:
          path: build_x86_64
          key: vslgpl-gcc-x86_64_toolchain-${{ github.run_id }}
          restore-keys: |
            vslgpl-gcc-x86_64_toolchain

      - name: Dropping stale package stamps from the cache
        # Only the toolchain is cached; src_packages is not, so cached "downloaded" stamps would break `update`.
        run: rm -rf build_$BIT/packages build_$BIT/mpv-*

      - name: Configuring (plain x86_64, NOT x86-64-v3)
        run: |
          cmake -DTARGET_ARCH=x86_64-w64-mingw32 -DGCC_ARCH=x86-64 -DSINGLE_SOURCE_LOCATION=$PWD/src_packages -DRUSTUP_LOCATION=$PWD/clang_root/install_rustup -DENABLE_CCACHE=ON --fresh -G Ninja -B build_$BIT -S $PWD
          ninja -C build_$BIT download || true

      - name: Building toolchain
        run: |
          if [[ ! -f "build_$BIT/install/bin/cross-gcc" ]]; then ninja -C build_$BIT gcc && rm -rf build_$BIT/toolchain; fi

      - name: Saving toolchain cache
        uses: actions/cache/save@v4
        with:
          path: build_x86_64
          key: vslgpl-gcc-x86_64_toolchain-${{ github.run_id }}

      - name: Building libmpv (LGPL)
        run: |
          ninja -C build_$BIT update
          ninja -C build_$BIT mpv

      - name: Packaging libmpv-dev and checking licence
        id: pkg
        run: |
          set -e
          dir=$(ls -d build_$BIT/mpv-dev-x86_64-* | head -1)
          name=$(basename "$dir")
          sha=${name##*-git-}
          date=$(echo "$name" | sed -E 's/mpv-dev-x86_64-([0-9]{8}).*/\1/')
          tag="videosport-lgpl-${sha}-${date}"
          dll="$dir/libmpv-2.dll"
          # mpv-configuration and the FFmpeg configuration are embedded in the DLL as plain strings.
          # strings to a file first: `strings | grep -q` under pipefail gives false negatives (SIGPIPE).
          strings -a "$dll" > /tmp/dll-strings.txt
          { echo "# strings extracted from libmpv-2.dll"; grep -E -- '^ ?(-D[a-z0-9_-]+=|--enable-|--disable-|--prefix=|--arch=|--cross-prefix=)' /tmp/dll-strings.txt || true; } > "$dir/mpv-configuration.txt"
          head -80 "$dir/mpv-configuration.txt"
          if grep -q -- '--enable-gpl' /tmp/dll-strings.txt; then echo "ERROR: FFmpeg inside DLL is GPL"; exit 1; fi
          if grep -q -- '--enable-nonfree' /tmp/dll-strings.txt; then echo "ERROR: nonfree"; exit 1; fi
          if grep -q -- '--enable-version3' /tmp/dll-strings.txt; then echo "ERROR: version3"; exit 1; fi
          if ! grep -q -- '-Dgpl=false' /tmp/dll-strings.txt; then echo "ERROR: -Dgpl=false not found in DLL"; exit 1; fi
          mkdir -p out
          cp -r "$dir" "out/libmpv-lgpl-x86_64-${sha}-${date}"
          cd out
          7z a -m0=lzma2 -mx=9 "libmpv-lgpl-x86_64-${sha}-${date}.7z" "libmpv-lgpl-x86_64-${sha}-${date}"
          rm -rf "libmpv-lgpl-x86_64-${sha}-${date}"
          sha256sum *.7z | tee SHA256SUMS.txt
          echo "tag=$tag" >> $GITHUB_OUTPUT

      - name: Collecting logs
        if: always()
        run: |
          mkdir -p logs
          cp -fr $(find build_$BIT -type f -iname "*-*.log" -or -wholename "*/ffbuild/config.log") logs || true
          7z a -m0=lzma2 -mx=9 logs.7z logs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libmpv-lgpl-logs
          path: logs.7z
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: libmpv-lgpl-x86_64
          path: out/*

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.release != 'false' }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: libmpv-lgpl-x86_64
          path: out
      - name: Create release
        run: |
          tag="${{ needs.build.outputs.tag }}"
          gh release create "$tag" out/* --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "$tag" --notes "LGPL libmpv-2.dll (x86_64 baseline). Built by videosport-libmpv.yml from branch videosport-lgpl. See README_videosport.md. SHA256 in SHA256SUMS.txt."
